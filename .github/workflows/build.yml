name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build with Maven
        run: mvn clean package -B -V

      - name: Prepare release notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          name: javafx-ui_${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
